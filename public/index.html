<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>컬러 타일 멀티</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c1e21;--mu:#6b7280;--bd:#d9dce1;--ac:#3b6cf6;--empty:#e6e8ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--card:#1f2329;--tx:#eceef1;--mu:#98a0ab;--bd:#343a43;--empty:#2a2f37}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1f2329;--tx:#eceef1;--mu:#98a0ab;--bd:#343a43;--empty:#2a2f37}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
#v-lobby,#v-room,#v-result{max-width:900px;margin:0 auto}
.cdov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:30;font-weight:800;color:#fff;font-size:min(40vw,220px)}
#cdn{animation:cdpop .4s ease-out}@keyframes cdpop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
#fog{position:fixed;inset:0;z-index:24;pointer-events:none;overflow:hidden}
.fogb{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle,rgba(228,234,246,.8) 0%,rgba(228,234,246,.45) 40%,rgba(228,234,246,0) 70%);will-change:transform,opacity}
.fogblur{position:absolute;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#nite{position:fixed;inset:0;z-index:26;pointer-events:none;background:radial-gradient(circle 120px at var(--mx,50%) var(--my,50%),rgba(0,0,0,0) 0,rgba(0,0,0,.94) 100%);animation:fin .4s}
#flash{position:fixed;inset:0;z-index:27;pointer-events:none;background:#fff;animation:fl .5s ease-out forwards}
@keyframes fin{from{opacity:0}to{opacity:1}}@keyframes fl{0%{opacity:var(--a,.7)}100%{opacity:0}}
.quake{animation:qk .09s linear infinite}@keyframes qk{0%{transform:translateX(-5px)}50%{transform:translateX(5px)}100%{transform:translateX(-5px)}}
#fx,#fog,#fog *,.fogb,#nite,#flash,#glass,#runners,#runners *{pointer-events:none!important} /* 방해 효과가 클릭을 가로채지 않도록 */
.ver{font-size:12px;font-weight:400;color:var(--mu);margin-left:2px;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h1{text-align:center;margin:8px 0 12px}
button,select,input[type=text]{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.hidden{display:none!important}.mu{color:var(--mu);font-size:13px}.err{color:#e53935;font-size:14px;min-height:18px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.pl.me{font-weight:700;color:var(--ac)}
.code{font-size:28px;font-weight:800;letter-spacing:4px}
.top{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:8px}
.game{display:flex;gap:12px;flex-wrap:wrap}
#boardBox{flex:1 1 640px;min-width:0}
#board{display:grid;gap:2px;background:var(--bd);padding:2px;border-radius:8px;touch-action:manipulation}
.t{aspect-ratio:1;border-radius:12%;position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,1.7vw,18px);color:#fff;cursor:pointer;user-select:none;background:var(--empty)}
.t span{opacity:.5}
.ghost{position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:pop .1s ease-out forwards}
@keyframes pop{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.65)}}.noshape .t span{display:none}
#side{flex:0 0 220px}
@media (max-width:820px){#side{flex:1 1 100%}}
</style>
</head>
<body>
<div class="wrap">
<div id="testbadge" class="hidden" style="text-align:center;margin-bottom:8px"><span style="background:#7a1f1f;color:#fff;border-radius:999px;padding:3px 12px;font-size:12px">🧪 테스트 모드 · 게임 중 F9 = 200점</span></div>

<div id="v-lobby">
  <h1>컬러 타일 멀티 <small class="ver">v32</small></h1>
  <div class="card">
      <div class="row"><button class="p" id="create">방 생성</button><button id="quick">빠른 입장 (랜덤 매칭)</button></div>
    <div class="row"><input type="text" id="code" maxlength="4" placeholder="방 코드" style="width:110px;text-transform:uppercase"><button class="p" id="join">방 접속</button></div>
    <div class="err" id="err"></div>
    <details><summary>하는 방법</summary>
      <p>빈 칸을 누르면 상·하·좌·우 직선에서 가장 가까운 타일을 찾습니다. 같은 색이 2개 이상이면 제거되고 점수를 얻습니다. 맞는 타일이 없으면 1점 감점(최소 0점)입니다.</p></details>
  </div>
</div>

<div id="v-room" class="hidden">
  <div class="card">
    <div class="mu">ROOM CODE</div><div class="code" id="rcode">----</div>
    <div class="row"><button id="copy">🔗 링크 복사</button><button id="leave">나가기</button></div>
  </div>
  <div class="card"><b>👤 내 닉네임</b> <span class="mu">준비 완료 전까지 자유롭게 변경할 수 있어요</span>
    <div class="row"><input type="text" id="mynick" maxlength="10" placeholder="닉네임"><button id="setnick">변경</button></div>
    <div class="mu" id="nickmsg"></div></div>
  <div class="card" id="settings">
    <b>⚙️ 방 설정</b>
    <div class="row"><label>색상 모드 <select id="cmode"><option value="1">모드 1</option><option value="2">모드 2</option></select></label></div>
    <div class="row"><label>게임 모드 <select id="gmode"><option value="normal">일반</option><option value="survival">서바이벌</option><option value="combo">콤보</option></select></label></div>
    <div class="mu" id="gdesc"></div>
    <div class="row" id="swatch"></div>
    <div class="row"><label><input type="checkbox" id="force"> 강제 시작 (준비 무시)</label></div>
    <div class="mu" id="hostonly">방장만 변경할 수 있습니다.</div>
  </div>
  <div class="card"><b>🎛️ 내 설정</b> <span class="mu">나에게만 적용돼요</span>
    <div class="row"><label><input type="checkbox" id="shape"> 타일 문양 표시</label><label><input type="checkbox" id="sfx" checked> 효과음</label></div></div>
  <div class="card"><b>접속자 목록</b><div id="plist"></div><div class="mu" id="gmsg" style="margin-top:8px"></div>
    <div class="row"><button id="ready">준비</button><button class="p" id="go">게임 시작</button></div>
    <div class="err" id="rmsg"></div></div>
</div>

<div id="v-game" class="hidden">
  <div class="top"><span id="time">Time: 120</span><span id="combo" class="hidden"></span><span id="score">Score: 0</span></div>
    <div class="game"><div id="boardBox"><div id="board"></div></div>
  <div id="side" class="card"><b>점수판</b><div id="scores"></div></div></div>
</div>

<div id="v-result" class="hidden">
  <h1>최종 결과</h1>
  <div class="card"><h3>🏆 순위표</h3><div id="rank"></div></div>
  <div class="row"><button class="p" id="back">대기실로 돌아가기</button><button id="leave2">나가기</button></div>
</div>
</div>

<canvas id="fx" class="hidden" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25"></canvas><div id="fog" class="hidden"></div><div id="nite" class="hidden"></div><div id="flash" class="hidden"></div>
<canvas id="glass" class="hidden" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25;transition:opacity .5s"></canvas><div id="runners" class="hidden" style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:24"></div>
<div id="cd" class="cdov hidden"><span id="cdn">3</span></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>
<script>
const GLY=["●","▲","■","◆","★","♥","✚","✖","☾","⬢","✦","▼"];
const PALS={
 1:["#ED5474","#FDB400","#E6E266","#9DE48F","#39AB66","#72F1FF","#2E6CDC","#8F52D0","#FFBDF5","#ABABAB","#896D63","#F5F5F5"],
 2:["#B3000E","#FFA17E","#FDDD00","#9DE48F","#0A6409","#BABCFF","#2287FF","#8D0E92","#FF95D1","#636363","#896D63","#F2F2F2"]};
const lt=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150};
const ch=h=>[h.slice(1,3),h.slice(3,5),h.slice(5,7)].map(x=>parseInt(x,16));
const hx=a=>"#"+a.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
// 왼쪽 위: 색상 닷지(흰색 빛)는 흰색 쪽으로 섞은 색, 오른쪽 아래: 곱하기(본래 색 명암)는 색×색으로 계산해 대각선 그라데이션으로 표현
const LIGHT=.35,SHADE=.5; // 빛(왼쪽 위)·그림자(오른쪽 아래) 강도: 0이면 효과 없음
const grad=h=>{const c=ch(h),lit=hx(c.map(v=>v+(255-v)*LIGHT)),sh=hx(c.map(v=>v+(v*v/255-v)*SHADE));return `linear-gradient(135deg,${lit} 0%,${h} 58%,${sh} 90%,${sh} 100%)`};
const GR={};for(const m in PALS)GR[m]=PALS[m].map(grad);
let mode=1,miss=0,perfect=false,cbm={},evs=[]; // miss: 연속으로 틀린 횟수, perfect: 만점(200점) 효과 재생 여부
const $=id=>document.getElementById(id), s=io();
let room=null,view="lobby",board,endAt=0,tick,sc={};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(v){view=v;if(v!=="game")stopFx();$("testbadge").classList.toggle("hidden",!(room&&room.test));if(v!=="room")$("cd").classList.add("hidden");["lobby","room","game","result"].forEach(x=>$("v-"+x).classList.toggle("hidden",x!==v))}
let opt={shape:false,sfx:true},ac;
try{Object.assign(opt,JSON.parse(localStorage.getItem("opt")||"{}"))}catch(e){}
$("shape").checked=opt.shape;$("sfx").checked=opt.sfx;
const AC=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac};
// 사람 목소리 느낌의 소리: 톱니파 + 모음 포먼트 필터 (군중 소리를 흉내 냄)
function voice(t,f0,f1,dur,fm,vol){const c=AC(),o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f1,t+dur);
  l.frequency.value=4.5+Math.random()*2.5;lg.gain.value=f0*.025;l.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.3);g.gain.linearRampToValueAtTime(vol*.8,t+dur*.7);g.gain.linearRampToValueAtTime(.0001,t+dur);
  fm.forEach(([f,q,k])=>{const b=c.createBiquadFilter(),m=c.createGain();b.type="bandpass";b.frequency.value=f;b.Q.value=q;m.gain.value=k;o.connect(b);b.connect(m);m.connect(g)});
  g.connect(c.destination);o.start(t);l.start(t);o.stop(t+dur+.05);l.stop(t+dur+.05)}
// 야유(부우~): 낮은 "우" 소리를 여러 명이 내며 음이 아래로 처짐
function boo(){if(!opt.sfx||playC("boo"))return;try{const c=AC(),t=c.currentTime;
  for(let i=0;i<7;i++){const f=100+Math.random()*60,d=1.3+Math.random()*.5;voice(t+Math.random()*.3,f,f*.78,d,[[300,6,1.3],[850,8,.7]],.28)}}catch(e){}}
// 만점 축하: 박수 소리 + 환호성
function cheer(){if(!opt.sfx||playC("cheer"))return;try{const c=AC(),t=c.currentTime,len=3.4;
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource();src.buffer=nb;src.loop=true;
  const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=1200;
  const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=2800;bp.Q.value=.7;
  const cl=c.createGain(),env=c.createGain();cl.gain.setValueAtTime(0,t);
  for(let x=0;x<len-.2;x+=.012+Math.random()*.03){cl.gain.setValueAtTime(.25+Math.random()*.6,t+x);cl.gain.linearRampToValueAtTime(.02,t+x+.01)}
  env.gain.setValueAtTime(.0001,t);env.gain.linearRampToValueAtTime(.8,t+.5);env.gain.setValueAtTime(.8,t+len-1.2);env.gain.linearRampToValueAtTime(.0001,t+len);
  src.connect(hp);hp.connect(bp);bp.connect(cl);cl.connect(env);env.connect(c.destination);src.start(t);src.stop(t+len);
  for(let i=0;i<9;i++){const f=190+Math.random()*160,d=1+Math.random()*.7;voice(t+.1+Math.random()*1.4,f,f*1.3,d,[[700,7,1],[1150,8,.7]],.12)}}catch(e){}}
function tone(f,d,type,v){if(!opt.sfx)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
$("shape").onchange=$("sfx").onchange=()=>{opt.shape=$("shape").checked;opt.sfx=$("sfx").checked;try{localStorage.setItem("opt",JSON.stringify(opt))}catch(e){};tone(660,.08,"sine",.15)};
const nick=()=>{try{return localStorage.getItem("nick")||""}catch(e){return ""}};
const res=r=>{$("err").textContent=r.ok?"":r.msg||"실패"};
$("create").onclick=()=>s.emit("createRoom",{nick:nick()},res);
$("quick").onclick=()=>s.emit("quickMatch",{nick:nick()},res);
$("join").onclick=()=>s.emit("joinRoom",{code:$("code").value,nick:nick()},res);
const q=(new URLSearchParams(location.search).get("room")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
const cleanUrl=()=>{try{history.replaceState(null,"",location.pathname)}catch(e){}};
// 초대 링크(/?room=코드)로 열면 바로 그 방에 접속
if(q){$("code").value=q;$("err").textContent="방에 접속하는 중...";s.emit("joinRoom",{code:q,nick:nick()},res)}
$("force").onchange=$("cmode").onchange=$("gmode").onchange=()=>s.emit("settings",{force:$("force").checked,mode:+$("cmode").value,gmode:$("gmode").value});
function sendNick(){const v=$("mynick").value.trim();if(!v){$("nickmsg").textContent="닉네임을 입력해 주세요.";return}
  s.emit("nick",v,r=>{$("nickmsg").textContent=r&&r.ok?"변경했어요.":(r&&r.msg)||"변경할 수 없어요.";if(r&&r.ok)try{localStorage.setItem("nick",v)}catch(e){}})}
$("setnick").onclick=sendNick;$("mynick").onkeydown=e=>{if(e.key==="Enter")sendNick()};
document.addEventListener("keydown",e=>{if(e.key==="F9"&&view==="game"&&room&&room.test){e.preventDefault();s.emit("cheat")}});
$("copy").onclick=()=>{const u=location.origin+"/?room="+room.code;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>$("rmsg").textContent="링크를 복사했습니다.").catch(()=>$("rmsg").textContent=u)};
const out=()=>{s.emit("leave");room=null;cleanUrl();go("lobby")};
$("leave").onclick=$("leave2").onclick=out;
$("ready").onclick=()=>{const p=room.players.find(p=>p.id===s.id);s.emit("ready",!p.ready)};
$("go").onclick=()=>{$("rmsg").textContent="";s.emit("start")};
$("back").onclick=()=>{s.emit("back");go("room")};

s.on("room",r=>{room=r;if(r.state==="lobby")$("cd").classList.add("hidden");if(view==="lobby")go("room");renderRoom();if(view==="game")renderScores()});
s.on("kicked",()=>{room=null;cleanUrl();go("lobby");$("err").textContent="방에서 추방되었습니다."});
const stLabel=p=>p.st==="playing"?"🎮 게임 중":p.st==="result"?"📋 결과 확인 중":p.id===room.host?"방장":p.ready?"✅ 준비":"대기";
function renderRoom(){
  const host=room.host===s.id,me=room.players.find(p=>p.id===s.id);
  $("rcode").textContent=room.code;
  $("force").checked=room.force;
  $("force").disabled=$("cmode").disabled=$("gmode").disabled=!host;$("cmode").value=room.mode;$("gmode").value=room.gmode||"normal";$("gdesc").textContent=GDESC[room.gmode||"normal"];
  $("swatch").innerHTML=PALS[room.mode].map((h,i)=>`<span style="display:inline-block;width:20px;height:20px;border-radius:4px;background:${GR[room.mode][i]}"></span>`).join("");$("hostonly").classList.toggle("hidden",host);
  $("plist").innerHTML=room.players.map(p=>`<div class="pl${p.id===s.id?" me":""}"><span>${p.id===room.host?"👑 ":""}${esc(p.nick)}${p.id===s.id?" (나)":""}</span><span>${stLabel(p)}${host&&p.id!==s.id?` <button data-k="${p.id}">추방</button>`:""}</span></div>`).join("");
  $("plist").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>s.emit("kick",b.dataset.k));
  $("ready").classList.toggle("hidden",host);$("go").classList.toggle("hidden",!host);
  $("ready").textContent=me&&me.ready?"준비 취소":"준비";
  const nm=$("mynick"),RM="준비 취소 후 닉네임을 변경할 수 있어요.";
  if(document.activeElement!==nm)nm.value=me?me.nick:"";
  nm.disabled=$("setnick").disabled=!!(me&&(me.ready||me.st==="playing"));
  if(me&&me.ready)$("nickmsg").textContent=RM;else if($("nickmsg").textContent===RM)$("nickmsg").textContent="";
  $("go").disabled=room.state!=="lobby"||(!room.force&&room.players.some(p=>p.st==="lobby"&&p.id!==room.host&&!p.ready));
  $("gmsg").textContent=room.state!=="lobby"?"게임이 진행 중이에요. 끝나면 시작할 수 있어요.":"";
}
function render(gh){
  const b=$("board");b.style.gridTemplateColumns=`repeat(${Game.W},1fr)`;b.innerHTML="";
  board.forEach((row,y)=>row.forEach((v,x)=>{const d=document.createElement("div");d.className="t";
    if(v>=0){d.style.background=GR[mode][v];d.style.color=lt(PALS[mode][v])?"#000":"#fff";if(opt.shape)d.innerHTML=`<span>${GLY[v]}</span>`}
    d.onclick=()=>click(y,x);b.appendChild(d)}));
  (gh||[]).forEach(([y,x,v])=>{const g=document.createElement("i");g.className="ghost";g.style.background=GR[mode][v];g.style.color=lt(PALS[mode][v])?"#000":"#fff";
    if(opt.shape)g.innerHTML=`<span>${GLY[v]}</span>`;g.onanimationend=()=>g.remove();b.children[y*Game.W+x].appendChild(g)});
}
function click(y,x){
  if(Date.now()>endAt)return;
  const snap=board.map(r=>r.slice()),rem=Game.applyClick(board,y,x);if(rem===null)return;
  s.emit("click",{y,x});
  if(!rem.length){miss++;if(miss>=3){miss=0;boo()}else tone(140,.15,"square",.28)}else{miss=0;tone(520+Math.min(rem.length,4)*100,.09,"sine",.28)}
  render(rem.map(([j,i])=>[j,i,snap[j][i]]));
}
function renderScores(){
  const gm=room.gmode,cm=p=>cbm[p.id]||{c:0,m:0};
  const list=room.players.filter(p=>p.st==="playing").map(p=>({...p,score:sc[p.id]??p.score})).sort((a,b)=>gm==="combo"?(cm(b).m-cm(a).m||b.score-a.score):b.score-a.score);
  $("scores").innerHTML=list.map(p=>`<div class="pl${p.id===s.id?" me":""}"><span>${esc(p.nick)}${gm==="combo"?` <small>🔥${cm(p).c} (최고 ${cm(p).m})</small>`:""}</span><span>${p.score}</span></div>`).join("");
  $("score").textContent="Score: "+(sc[s.id]??0);
  if(gm==="combo"){const c=cm({id:s.id});$("combo").textContent=`🔥 콤보 ${c.c} (최고 ${c.m})`}
}
s.on("countdown",({n})=>{
  $("cd").classList.remove("hidden");const e=$("cdn");e.textContent=n;e.style.animation="none";void e.offsetWidth;e.style.animation="";if(!playC("countdown"))tone(660,.12,"sine",.28);
});
const GDESC={normal:"점수가 높은 순으로 순위를 매겨요.",survival:"게임 중 90·60·30초가 남았을 때 방해 이벤트가 한 번씩 발생해요.",combo:"한 판에서 연속으로 깬 콤보가 가장 높은 순으로 순위를 매겨요. 틀리면 콤보가 초기화돼요."};
// ---------- 서바이벌 방해 이벤트 ----------
const fxc=$("fx"),fctx=fxc.getContext("2d");let fxRaf=0,evT=[],mx=innerWidth/2,my=innerHeight/2;
const moveNite=(x,y)=>{mx=x;my=y;const n=$("nite");n.style.setProperty("--mx",x+"px");n.style.setProperty("--my",y+"px")};
addEventListener("mousemove",e=>moveNite(e.clientX,e.clientY));
addEventListener("touchstart",e=>moveNite(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
addEventListener("touchmove",e=>moveNite(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
function stopFx(){evT.forEach(clearTimeout);evT=[];cancelAnimationFrame(fxRaf);fctx.clearRect(0,0,fxc.width,fxc.height);$("fog").innerHTML="";$("runners").innerHTML="";cancelAnimationFrame(runRaf);["fx","fog","nite","flash","glass","runners"].forEach(i=>$(i).classList.add("hidden"));$("fog").innerHTML="";$("board").classList.remove("quake")}
function sched(){evT.forEach(clearTimeout);evT=evs.map(e=>setTimeout(()=>runEvent(e.t,e.d),e.at))}
function precip(kind,d){fxc.width=innerWidth;fxc.height=innerHeight;fxc.classList.remove("hidden");
  const snow=kind==="snow",P=[];for(let i=0;i<(snow?650:320);i++)P.push({x:Math.random()*fxc.width,y:Math.random()*fxc.height,r:snow?1.2+Math.random()*3.3:1+Math.random()*3,v:snow?10+Math.random()*13:20+Math.random()*10,w:snow?7+Math.random()*10:4});
  const t0=performance.now(),end=t0+d;cancelAnimationFrame(fxRaf);
  const step=t=>{fctx.clearRect(0,0,fxc.width,fxc.height);fctx.globalAlpha=Math.max(0,Math.min(1,(t-t0)/300,(end-t)/400));
    P.forEach(p=>{p.x+=p.w;p.y+=p.v;if(p.y>fxc.height){p.y=-10;p.x=Math.random()*fxc.width}if(p.x>fxc.width)p.x=0;
      if(snow){fctx.fillStyle="rgba(255,255,255,.92)";fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()}
      else{fctx.strokeStyle="rgba(170,200,255,.6)";fctx.lineWidth=1.3;fctx.beginPath();fctx.moveTo(p.x,p.y);fctx.lineTo(p.x-p.w*1.2,p.y-p.v*1.2);fctx.stroke()}});
    if(t<end)fxRaf=requestAnimationFrame(step);else{fctx.clearRect(0,0,fxc.width,fxc.height);fxc.classList.add("hidden")}};
  fxRaf=requestAnimationFrame(step)}
const flash=()=>{const f=$("flash");f.style.setProperty("--a",.45+Math.random()*.3);f.classList.remove("hidden");f.style.animation="none";void f.offsetWidth;f.style.animation="";setTimeout(()=>f.classList.add("hidden"),520)};
// ---------- 추가 이벤트: 캐릭터 소동 / 난사 ----------
const RUNNER_FALLBACK="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="28" fill="#ffd54f" stroke="#333" stroke-width="3"/><circle cx="23" cy="27" r="4" fill="#333"/><circle cx="41" cy="27" r="4" fill="#333"/><path d="M20 40q12 12 24 0" fill="none" stroke="#333" stroke-width="3"/></svg>');
let runRaf=0;
// 이미지는 public/runner.png 를 불러옴 (없으면 기본 얼굴 그림 사용). 5~10개가 랜덤 크기·속도로 화면을 돌아다님
function runners(d){const box=$("runners"),W=innerWidth,H=innerHeight,n=5+Math.floor(Math.random()*6),R=[];box.innerHTML="";box.classList.remove("hidden");
  for(let i=0;i<n;i++){const im=new Image(),z=50+Math.random()*100,sp=80+Math.random()*320,a=Math.random()*6.283;
    im.onerror=()=>{im.onerror=null;im.src=RUNNER_FALLBACK};im.src="/runner.png";
    im.style.cssText=`position:absolute;left:0;top:0;width:${z}px;image-rendering:pixelated;will-change:transform`;box.appendChild(im);
    R.push({im,z,x:Math.random()*(W-z),y:Math.random()*(H-z*1.4),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:Math.random()*360,spin:(Math.random()<.5?-1:1)*(60+Math.random()*240)})}
  const t0=performance.now();let last=t0;cancelAnimationFrame(runRaf);
  const step=t=>{const dt=Math.min(.05,(t-last)/1e3);last=t;
    R.forEach(r=>{r.x+=r.vx*dt;r.y+=r.vy*dt;if(r.x<0||r.x>W-r.z){r.vx*=-1;r.x=Math.max(0,Math.min(W-r.z,r.x))}if(r.y<0||r.y>H-r.z*1.4){r.vy*=-1;r.y=Math.max(0,Math.min(H-r.z*1.4,r.y))}
      r.rot+=r.spin*dt;r.im.style.transform=`translate(${r.x}px,${r.y}px) rotate(${r.rot}deg)`});
    box.style.opacity=Math.max(0,Math.min(1,(t-t0)/300,(t0+d-t)/400));
    if(t<t0+d)runRaf=requestAnimationFrame(step);else{box.classList.add("hidden");box.innerHTML=""}};
  runRaf=requestAnimationFrame(step)}
// 총알 구멍 + 금 간 유리: 울퉁불퉁한 검은 구멍(가운데는 하얗게 뚫림) + 가는 균열. 어두운 배경에서도 보이게 흰 테두리를 깔아 줌
function ragged(c,cx,cy,r,spk){const n=14+Math.floor(Math.random()*8);c.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rr=r*(i%2?.7+Math.random()*.2:1+Math.random()*spk),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath()}
function bhole(c,cx,cy,r){ragged(c,cx,cy,r,.55);c.lineWidth=3;c.strokeStyle="rgba(255,255,255,.85)";c.stroke();c.fillStyle="#050505";c.fill();c.beginPath();c.arc(cx,cy,r*.5,0,7);c.fillStyle="#fff";c.fill();c.lineWidth=1.2;c.strokeStyle="#000";c.stroke()}
function crack(c,cx,cy,R){const ty=Math.random(),rays=ty<.4?14+Math.floor(Math.random()*6):ty<.75?7+Math.floor(Math.random()*4):0,pts=[];c.lineCap="round";
  const ln=(p,q,w)=>{c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);c.lineWidth=w+1.8;c.strokeStyle="rgba(255,255,255,.7)";c.stroke();c.lineWidth=w;c.strokeStyle="rgba(0,0,0,.95)";c.stroke()};
  for(let i=0;i<rays;i++){let a=i/rays*Math.PI*2+(Math.random()-.5)*.5,x=cx,y=cy;const len=R*(.5+Math.random()*.7),n=6+Math.floor(Math.random()*4),seg=[[cx,cy]];
    for(let k=1;k<=n;k++){a+=(Math.random()-.5)*.3;x+=Math.cos(a)*len/n;y+=Math.sin(a)*len/n;seg.push([x,y]);ln(seg[k-1],seg[k],Math.max(.6,1.5-k*.15));
      if(Math.random()<.18){const b=a+(Math.random()<.5?-1:1)*(.5+Math.random()*.6),bl=len/n*(1+Math.random()*2);ln([x,y],[x+Math.cos(b)*bl,y+Math.sin(b)*bl],.7)}}
    pts.push(seg)}
  if(ty<.4)for(let ring=1;ring<=3;ring++)for(let i=0;i<pts.length;i++){if(Math.random()<.2)continue;const A=pts[i],B=pts[(i+1)%pts.length];ln(A[Math.min(ring,A.length-1)],B[Math.min(ring,B.length-1)],.7)}
  bhole(c,cx,cy,R*(rays?.11:.16));if(!rays&&Math.random()<.4)bhole(c,cx+R*.22,cy+R*.1,R*.1)}
// 총소리 "탕!": 짧은 고음 잡음 + 낮은 울림
function shotSnd(){if(!opt.sfx||playC("shot"))return;try{const c=AC(),t=c.currentTime,n=nz(c,.25),h=c.createBiquadFilter(),g=c.createGain(),o=c.createOscillator(),og=c.createGain(),out=sfxOut(c);
  h.type="highpass";h.frequency.value=900;g.gain.setValueAtTime(1.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);n.connect(h);h.connect(g);g.connect(out);
  o.type="sine";o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);og.gain.setValueAtTime(.9,t);og.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(og);og.connect(out);
  n.start(t);o.start(t);o.stop(t+.25);n.stop(t+.25)}catch(x){}}
// ---------- 사용자 지정 효과음 (public/sfx_이름.mp3 또는 .wav 가 있으면 합성음 대신 사용) ----------
const CS={};
async function loadSounds(){if(loadSounds.done)return;loadSounds.done=true;const c=AC();
  for(const n of["shot","thunder","quake","wind","rain","boo","cheer","countdown"])for(const ext of["mp3","wav"]){
    try{const r=await fetch(`/sfx_${n}.${ext}`);if(!r.ok)continue;CS[n]=await c.decodeAudioData(await r.arrayBuffer());break}catch(e){}}}
addEventListener("pointerdown",loadSounds,{once:true});
const hasC=n=>!!CS[n];
function playC(n,maxMs){if(!opt.sfx||!CS[n])return false;try{const c=AC(),t=c.currentTime,src=c.createBufferSource(),g=c.createGain(),full=CS[n].duration,dur=maxMs?Math.min(full,maxMs/1000):full;
  src.buffer=CS[n];g.gain.setValueAtTime(1,t);if(dur<full){g.gain.setValueAtTime(1,t+Math.max(0,dur-.4));g.gain.linearRampToValueAtTime(.0001,t+dur)}
  src.connect(g);g.connect(c.destination);src.start(t);src.stop(t+dur);return true}catch(e){return false}}
function runEvent(t,d){
  if(t==="snow"){precip("snow",d);wind(d)}
  else if(t==="rain"){precip("rain",d);rainSnd(d)}
  else if(t==="quake"){const b=$("board");b.classList.add("quake");quakeSnd(d);setTimeout(()=>b.classList.remove("quake"),d)}
  else if(t==="fog"){const f=$("fog"),b=$("board").getBoundingClientRect(),W=innerWidth;f.innerHTML="";f.classList.remove("hidden");
    const bl=document.createElement("div");bl.className="fogblur";bl.style.cssText=`left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px`;f.appendChild(bl);
    bl.animate([{opacity:0},{opacity:1,offset:.2},{opacity:1,offset:.8},{opacity:0}],{duration:d+1200,fill:"forwards"});
    for(let i=0;i<7;i++){const z=320+Math.random()*280,e=document.createElement("div"),dir=Math.random()<.5?-1:1,x0=dir>0?-z*.6+Math.random()*W*.35:W*.65+Math.random()*W*.35-z*.4,y=b.top+Math.random()*b.height-z*.35;
      e.className="fogb";e.style.cssText=`width:${z}px;height:${z*.75}px`;f.appendChild(e);
      e.animate([{transform:`translate(${x0}px,${y}px)`,opacity:0},{opacity:1,offset:.25},{opacity:1,offset:.75},{transform:`translate(${x0+dir*(W*.4+Math.random()*W*.25)}px,${y+(Math.random()-.5)*80}px)`,opacity:0}],{duration:d+1200,easing:"linear",fill:"forwards"})}
    setTimeout(()=>{f.classList.add("hidden");f.innerHTML=""},d+1300)}
  else if(t==="runner")runners(d);
  else if(t==="shoot"){const g=$("glass"),c=g.getContext("2d");g.width=innerWidth;g.height=innerHeight;c.clearRect(0,0,g.width,g.height);g.style.opacity=1;g.classList.remove("hidden");
    for(let i=0;i<5;i++)setTimeout(shotSnd,200+i*150);
    for(let i=0;i<5;i++)setTimeout(()=>crack(c,100+Math.random()*(g.width-200),100+Math.random()*(g.height-200),110+Math.random()*100),1200+i*200);
    setTimeout(()=>{g.style.opacity=0},d-500);setTimeout(()=>g.classList.add("hidden"),d)}
  else if(t==="night"){moveNite(mx,my);$("nite").classList.remove("hidden");setTimeout(()=>$("nite").classList.add("hidden"),d)}
  else if(t==="thunder"){const n=Math.min(3+Math.floor(Math.random()*3),Math.floor((d-600)/800)+1);
    for(let i=0;i<n;i++){const a=300+(n>1?i*(d-900)/(n-1):0)+(i&&i<n-1?(Math.random()-.5)*200:0);
      setTimeout(()=>{const f=$("flash");f.classList.remove("hidden");f.style.animation="none";void f.offsetWidth;f.style.animation="";setTimeout(()=>f.classList.add("hidden"),520);(hasC("thunder")?(i===0&&playC("thunder",d)):thunderSnd(i===n-1?2.8:1.2+Math.random()*1.2,i===n-1?3.5:2.2+Math.random()*1.3))},a)}}}
const nz=(c,sec)=>{const b=c.createBuffer(1,Math.ceil(c.sampleRate*sec),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const n=c.createBufferSource();n.buffer=b;return n};
const sfxOut=c=>{const k=c.createDynamicsCompressor();k.connect(c.destination);return k};
function wind(d){if(!opt.sfx||playC("wind",d))return;try{const c=AC(),t=c.currentTime,e=d/1000,n=nz(c,e),f=c.createBiquadFilter(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
  f.type="bandpass";f.Q.value=1.2;f.frequency.value=550;l.frequency.value=.8;lg.gain.value=280;l.connect(lg);lg.connect(f.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(2,t+.7);g.gain.setValueAtTime(2,t+e-.7);g.gain.linearRampToValueAtTime(.0001,t+e);
  n.connect(f);f.connect(g);g.connect(sfxOut(c));n.start(t);l.start(t);l.stop(t+e)}catch(x){}}
function quakeSnd(d){if(!opt.sfx||playC("quake",d))return;try{const c=AC(),t=c.currentTime,e=d/1000,n=nz(c,e),f=c.createBiquadFilter(),g=c.createGain(),o=c.createOscillator(),og=c.createGain(),tr=c.createOscillator(),tg=c.createGain();
  f.type="lowpass";f.frequency.value=110;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(3,t+.4);g.gain.setValueAtTime(3,t+e-.6);g.gain.linearRampToValueAtTime(.0001,t+e);
  o.type="sine";o.frequency.value=42;tr.frequency.value=9;tg.gain.value=.25;og.gain.value=.3;tr.connect(tg);tg.connect(og.gain);o.connect(og);og.connect(g);
  n.connect(f);f.connect(g);g.connect(sfxOut(c));n.start(t);o.start(t);tr.start(t);o.stop(t+e);tr.stop(t+e)}catch(x){}}
function thunderSnd(len=2.8,vol=3.5){if(!opt.sfx)return;try{const c=AC(),t=c.currentTime,n=nz(c,len+.3),f=c.createBiquadFilter(),g=c.createGain(),k=nz(c,.3),h=c.createBiquadFilter(),kg=c.createGain(),o=sfxOut(c);
  f.type="lowpass";f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(70,t+len*.93);g.gain.setValueAtTime(vol,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+len);
  h.type="highpass";h.frequency.value=1500;kg.gain.setValueAtTime(.8,t);kg.gain.exponentialRampToValueAtTime(.001,t+.25);
  n.connect(f);f.connect(g);g.connect(o);k.connect(h);h.connect(kg);kg.connect(o);n.start(t);k.start(t);n.stop(t+len+.3);k.stop(t+.3)}catch(x){}}
// 빗소리: 고음 쪽 잡음을 부드럽게 깔아 줌
function rainSnd(d){if(!opt.sfx||playC("rain",d))return;try{const c=AC(),t=c.currentTime,e=d/1000,n=nz(c,e),h=c.createBiquadFilter(),l=c.createBiquadFilter(),g=c.createGain();
  h.type="highpass";h.frequency.value=900;l.type="lowpass";l.frequency.value=7500;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.6,t+.5);g.gain.setValueAtTime(.6,t+e-.6);g.gain.linearRampToValueAtTime(.0001,t+e);
  n.connect(h);h.connect(l);l.connect(g);g.connect(sfxOut(c));n.start(t)}catch(x){}}
s.on("start",({seed,n,mode:m,ms,events})=>{mode=m||1;miss=0;perfect=false;cbm={};evs=events||[];$("combo").classList.toggle("hidden",room.gmode!=="combo");
  board=Game.makeBoard(seed,n);endAt=Date.now()+ms;sc={};render();renderScores();go("game");sched();
  clearInterval(tick);tick=setInterval(()=>{{const l=Math.max(0,Math.ceil((endAt-Date.now())/1000));$("time").textContent="Time: "+l+(l===0?" · 다른 플레이어 대기 중":"")}},250);
});
s.on("scores",a=>{a.forEach(x=>{sc[x.id]=x.score;cbm[x.id]={c:x.combo||0,m:x.max||0};if(x.id===s.id&&x.score>=200&&!perfect){perfect=true;cheer()}});if(view==="game")renderScores()});
s.on("end",rank=>{
  clearInterval(tick);endAt=0;stopFx();
  $("rank").innerHTML=rank.map((p,i)=>`<div class="pl${p.id===s.id?" me":""}"><span>${i+1}위 ${esc(p.nick)}</span><span>${room.gmode==="combo"?`🔥 ${p.combo}콤보 · `:""}${p.score}점</span></div>`).join("");
  go("result");
});
